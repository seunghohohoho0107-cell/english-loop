es, which can be calculated from the sounds easily.", "A violin has many more overtones compared to a flute and sounds brighter.", "An oboe is brighter than a classical guitar, and a crash cymbal brighter than a double bass.", "This is obvious, and indeed people like brightness.", "One reason is that it makes sound subjectively louder, which is part of the loudness war in modern electronic music, and in the classical music of the 19th century.", "All sound engineers know that if they play back a track to a musician that just has recorded this track and add some higher frequencies, the musician will immediately like the track much better.", "But this is a short-lived effect, and in the long run, people find such sounds too bright.", "So it is wise not to play back such a track with too much brightness, as it normally takes quite some time to convince the musician that less brightness serves his music better in the end."], "blanks": [{"sentence_index": 0, "target": "higher frequencies", "choices": ["lower volumes", "higher frequencies", "slower rhythms", "shorter recordings"], "explanation": "밝기는 높은 주파수 성분의 에너지와 관련됩니다."}, {"sentence_index": 4, "target": "subjectively louder", "choices": ["subjectively louder", "completely silent", "rhythmically simpler", "objectively slower"], "explanation": "밝기가 소리를 주관적으로 더 크게 느끼게 한다는 이유를 제시합니다."}, {"sentence_index": 6, "target": "a short-lived effect", "choices": ["an irreversible change", "a gradual decline", "a permanent improvement", "a short-lived effect"], "explanation": "고주파를 더했을 때의 즉각적인 호감은 오래가지 않습니다."}, {"sentence_index": 7, "target": "less brightness serves his music better", "choices": ["all high frequencies must disappear", "more brightness always improves his music", "less brightness serves his music better", "louder playback is the only solution"], "explanation": "최종적으로는 지나친 밝기를 줄이는 편이 음악에 도움이 된다는 결론입니다."}], "connectors": [{"sentence_index": 6, "target": "But", "choices": ["Therefore", "But", "Similarly", "For example"] 더하면, 음악가가 즉시 그 곡을 훨씬 더 좋아하게 된다는 것을 안다.", "grammar": []}, {"translation": "하지만 이는 잠깐 지속되는 효과이며, 장기적으로 사람들은 그러한 소리가 지나치게 밝다고 느낀다.", "grammar": []}, {"translation": "그러므로 그런 곡을 지나치게 밝게 재생하지 않는 것이 현명하다. 결국에는 밝기를 줄이는 것이 음악에 더 도움이 된다고 음악가를 설득하는 데 보통 상당한 시간이 걸리기 때문이다.", "grammar": []}], "reference": "사진 지문 기반 자체 작성 해석·학습 해설"}}, {"id": "2021_11_grade2_41_42", "title": "이야기와 신호가 갈등을 줄이는 방식", "unit": "2021년 11월 고2 모의고사 · 41–42번", "source": "사용자 제공 사진", "sentences": ["Stories populate our lives.", "If you are not a fan of stories, you might imagine that the best world is a world without them, where we can only see the facts in front of us.", "But to do this is to deny how our brains work, how they are designed to work.", "Evolution has given us minds that are alert to stories and suggestion because, through many hundreds of thousands of years of natural selection, minds that can attend to stories have been more successful at passing on their owners' genes.", "Think about what happens, for example, when animals face one another in conflict.", "They rarely plunge into battle right away.", "No, they first try to signal in all kinds of ways what the outcome of the battle is going to be.", "They puff up their chests, they roar, and they bare their fangs.", "Animals evolved to attend to stories and signals because these turn out to be an efficient way to navigate the world.", "If you and I were a pair of lions on the Serengeti, and we were trying to decide the strongest lion, it would be most foolish — for both of us — to plunge straight into a conflict.", "It is far better for each of us to make a show of strength, to tell the story of how our victory is inevitable.", "If one of those stories is much more convincing than the other, we might be able to agree on the outcome without actually having the fight."], "blanks": [{"sentence_index": 2, "target": "deny how our brains work", "choices": ["fully explain our emotions", "deny how our brains work", "improve our natural instincts", "prove how facts change"], "explanation": "이야기를 배제하는 것은 이야기에 반응하도록 작동하는 뇌를 부정하는 일이라는 주장입니다."}, {"sentence_index": 5, "target": "rarely plunge into battle right away", "choices": ["rarely plunge into battle right away", "never communicate before fighting", "immediately ignore each other", "always attack without warning"], "explanation": "동물들은 실제 싸움에 앞서 힘을 보여 주는 신호를 보냅니다."}, {"sentence_index": 8, "target": "an efficient way to navigate the world", "choices": ["an obstacle to all communication", "a reason to ignore every signal", "a meaningless form of entertainment", "an efficient way to navigate the world"], "explanation": "이야기와 신호에 반응하는 능력은 세계에 효율적으로 대응하는 데 도움이 됩니다."}, {"sentence_index": 11, "target": "without actually having the fight", "choices": ["without exchanging any signals", "only after a violent battle", "without actually having the fight", "by ignoring every warning"], "explanation": "힘을 보여 주는 이야기를 통해 실제 충돌 없이 결과에 합의할 수 있다는 결론입니다."}], "connectors": [{"sentence_index": 2, "target": "But", "choices": ["Therefore", "But", "Likewise", "For instance"], "explanation": "이야기 없는 세상이 좋을 것이라는 생각을 반박하는 전환입니다."}, {"sentence_index": 4, "target": "for example", "choices": ["for example", "as a result", "in conclusion", "on the contrary"], "explanation": "진화적 설명을 동물의 갈등 행동이라는 사례로 구체화합니다."}, {"sentence_index": 11, "target": "If", "choices": ["Unless", "Before", "Although", "If"], "explanation": "어느 한쪽의 신호가 훨씬 설득력 있을 경우라는 조건입니다."}], "vocabulary": [{"word": "populate", "meaning": "~을 채우다"}, {"word": "deny", "meaning": "부정하다"}, {"word": "evolution", "meaning": "진화"}, {"word": "alert to", "meaning": "~에 민감한"}, {"word": "natural selection", "meaning": "자연선택"}, {"word": "attend to", "meaning": "~에 주의를 기울이다"}, {"word": "pass on", "meaning": "전달하다"}, {"word": "plunge into", "meaning": "~에 뛰어들다"}, {"word": "puff up", "meaning": "부풀리다"}, {"word": "bare", "meaning": "드러내다"}, {"word": "fang", "meaning": "송곳니"}, {"word": "inevitable", "meaning": "불가피한"}, {"word": "convincing", "meaning" function shuffle(xs){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function orderView(){const p=passage(),items=state.orderItems,selected=state.orderSelected,finished=state.orderSubmitted;const expected=[...items.map(x=>x.idx)].sort((a,b)=>a-b);const isRight=expected.every((x,i)=>x===selected[i]);return `${header('문장 배열',p.title)}<div class="detail-head"><div class="eyebrow">SENTENCE ORDER</div><h2>글의 흐름에 맞게 배열하세요.</h2><p>아래 문장을 올바른 순서로 눌러주세요. 선택한 문장은 아래에 쌓입니다.</p><div class="chips"><span class="chip active">전체 ${p.sentences.length}문장 배열</span></div><div class="progress-track"><div class="progress-fill" style="width:${(selected.length/items.length)*100}%"></div></div></div>
<div class="sentence-pool">${items.map(item=>`<button class="sentence ${selected.includes(item.idx)?'queued':''}" data-action="select-sentence" data-idx="${item.idx}" ${selected.includes(item.idx)||finished?'disabled':''}><span class="letter">${item.label}</span><span class="english">${safe(item.text)}</span></button>`).join('')}</div>
<div class="selected-box"><div class="selected-head">나의 문장 배열 <span>${selected.length} / ${items.length}</span></div>${selected.length?selected.map((idx,i)=>{const match=items.find(x=>x.idx===idx);return `<div class="selected-line ${finished?(idx===expected[i]?'right':'wrong'):''}"><b>${i+1}. ${match.label}</b><span>${safe(match.text)}</span></div>`}).join(''):`<div class="empty">문장을 순서대로 선택하면 여기에 표시됩니다.</div>`}</div>
${!finished?`<div class="actions"><button class="btn btn-line" data-action="undo-order" ${selected.length?'':'disabled'}>↶ 하나 되돌리기</button><button class="btn btn-line" data-action="clear-order" ${selected.length?'':'disabled'}>↻ 초기화</button></div><button style="margin-top:10px" class="btn btn-primary full" data-action="check-order" ${selected.length===items.length?'':'disabled'}>정답 확인하기</button>`:`<div class="feedback ${isRight?'good':'error'}"><h3>${isRight?'✓ 정답입니다!':'↻ 순서가 다릅니다.'}</h3><p class="key">정답: ${expected.map(idx=>items.find(x=>x.idx===idx).label).join(' → ')}</p><p>정답 문장 순서를 확인하고 문장 사이의 연결어·지시어 및 글의 흐름을 다시 살펴보세요.</p></div><button style="margin-top:12px" class="btn btn-primary full" data-action="start-arrange">다시 섞어 풀기 ↻</button>`}`;}
function getQuestions(){return passage()[state.quizType]||[];}
function startQuiz(type){state.quizType=type;state.quizIndex=0;state.quizSelected=null;state.quizCorrect=0;state.quizComplete=false;state.quizResults=[];show('quiz');}
function displayGap(sentence,target){const pos=sentence.indexOf(target);if(pos<0)return `${safe(sentence)}<p class="error-text">이 문장의 빈칸 데이터를 확인해 주세요.</p>`;return `${safe(sentence.slice(0,pos))}<span class="blank" aria-label="빈칸">______</span>${safe(sentence.slice(pos+target.length))}`;}
function quizPassage(p,q,type){
  if(type!=='connectors')return `<div class="quiz-passage"><span class="eyebrow">PASSAGE · SENTENCE ${q.sentence_index+1}</span><p>${displayGap(p.sentences[q.sentence_index]||'',q.target)}</p></div>`;
  return `<section class="quiz-passage full-passage" aria-label="영어 지문 전체"><div class="full-passage-head"><span class="eyebrow">PASSAGE · 전체 지문</span><span class="passage-count">전체 ${p.sentences.length}문장</span></div><p class="passage-guide">연결어가 빠진 문장이 강조되어 있습니다. 앞뒤 문맥을 함께 확인하세요.</p><div class="full-passage-body">${p.sentences.map((sentence,i)=>`<p class="full-passage-line ${i===q.sentence_index?'active-sentence':''}"><span class="passage-num">${i+1}</span><span class="sentence-copy">${i===q.sentence_index?displayGap(sentence,q.target):safe(sentence)}</span></p>`).join('')}</div></section>`;
}
function quizView(){const p=passage(),qs=getQuestions(),q=qs[state.quizIndex],type=state.quizType,title=type==='blanks'?'빈칸 문제':'연결어 문제';if(state.quizComplete)return resultView();if(!q)return `${header(title,p.title)}<div class="intro">등록된 문제가 없습니다.</div>`;
const answered=state.quizSelected!==null;return `${header(title,p.title)}<div class="detail-head"><div class="status-number">문제 ${state.quizIndex+1} / ${qs.length}</div><div class="progress-track"><div class="progress-fill" style="width:${(state.quizIndex+1)/qs.length*100}%"></div></div><p style="margin-top:12px">${type==='blanks'?'빈칸에 들어갈 가장 적절한 표현을 고르세요.':'글의 흐름에 맞는 연결어를 고르세요.'}</p></div>${quizPassage(p,q,type)}<div class="status-number" style="margin:17px 0 10px">정답을 하나 선택하세요.</div><div>${q.choices.map((x,i)=>{const cls=answered?(x===q.target?'correct':x===state.quizSelected?'wrong':''):'';return `<button class="option ${cls}" data-action="choose-option" data-index="${i}" ${answered?'disabled':''}><span class="opnum">${i+1}</span><span>${safe(x)}</span>${answered&&x===q.target?'<span style="margin-left:auto;color:#398158">✓</span>':''}</button>`;}).join('')}</div>${answered?`<div class="feedback ${state.quizSelected===q.target?'good':'error'}"><h3>${state.quizSelected===q.target?'✓ 정답입니다!':'✕ 오답입니다.'}</h3><p class="key">정답: ${safe(q.target)}</p><p>${safe(q.explanation||'원문과 글의 흐름을 다시 확인해 보세요.')}</p></div><button class="btn btn-primary full" style="margin-top:12px" data-action="next-quiz">${state.quizIndex===qs.length-1?'결과 확인하기':'다음 문제 →'}</button>`:''}`;}
function resultView(){const p=passage(),total=getQuestions().length,score=state.quizCorrect,rate=Math.round(score/Math.max(1,total)*100),title=state.quizType==='blanks'?'빈칸 문제':'연결어 문제';return `${header('학습 완료',p.title)}<div class="result-main"><div class="eyebrow">QUIZ RESULT</div><h2>${safe(title)} 결과</h2><b>${score} / ${total}</b><p>정답률 ${rate}% · 학습 기록이 저장되었습니다.</p></div><div class="intro"><h2 class="intro-title">문제별 결과</h2>${state.quizResults.map((r,i)=>`<div class="selected-line ${r.correct?'right':'wrong'}"><b>${i+1}번 ${r.correct?'✓':'✕'}</b><span>${safe(r.answer)}${r.correct?'':`<br><span style="color:#9c6464">내 답: ${safe(r.selected)}</span>`}</span></div>`).join('')}</div><div class="actions"><button class="btn btn-line" data-action="navigate" data-target="passage">학습 메뉴</button><button class="btn btn-primary" data-action="start-type" data-type="${state.quizType}">다시 풀기 ↻</button></div>`;}
function readView(){const p=passage();return `${header('지문 원문',p.title)}<div class="intro"><p>원문을 확인한 뒤 학습 메뉴로 돌아가 문제를 풀어보세요.</p></div><div class="original">${p.sentences.map((s,i)=>`<p><span class="badge-num">${i+1}</span> &nbsp; ${safe(s)}</p>`).join('')}</div><div class="actions" style="margin-top:15px"><button class="btn btn-line" data-action="navigate" data-target="study">지문 해설 보기</button><button class="btn btn-primary" data-action="navigate" data-target="passage">문제 풀러 가기 →</button></div>`;}
function studyView(){
  const p=passage(),st=p.study;
  if(!st)return `${header('지문 해설',p.title)}<div class="intro"><p>이 지문에는 아직 해설 자료가 없습니다. ChatGPT에서 해설이 포함된 JSON을 추가할 수 있습니다.</p></div>`;
  const overview=[['제목',st.heading,st.headingKo],['주제',st.topic,st.topicKo],['요약',st.summary,st.summaryKo]];
  return `${header('지문 해설',p.title)}
    <div class="detail-head"><div class="eyebrow">PASSAGE GUIDE</div><h2>지문 전체 해설</h2><p>사진 지문을 바탕으로 해석과 학습 포인트를 정리했습니다.</p><div class="source-label">${safe(st.reference||'사용자 제공 해설 자료')}</div></div>
    <div class="study-section"><h2>제목 · 주제 · 요약</h2>${overview.map(([name,en,ko])=>`<div class="explain-card"><span class="explain-tag">${name}</span><div class="explain-en">${safe(en)}</div><p class="explain-ko">${safe(ko)}</p></div>`).join('')}</div>
    <div class="study-section"><h2>지문 구조</h2><div class="study-timeline">${(st.outline||[]).map(x=>`<div class="outline-line"><span>${safe(x.label)}</span><p>${safe(x.content)}</p></div>`).join('')}</div></div>
    <div class="study-section"><h2>배경 지식</h2><div class="explain-card"><strong>${safe(st.backgroundTitle||'배경 지식')}</strong><p class="explain-ko">${safe(st.background||'')}</p></div></div>
    <div class="study-section"><h2>문장별 분석 <span class="count-bubble">${p.sentences.length}문장</span></h2><p class="section-intro">각 문장의 원문과 해석을 확인하고, 문법 포인트를 펼쳐 보세요.</p>
      ${p.sentences.map((sentence,i)=>{const x=(st.notes||[])[i]||{};return `<article class="line-analysis"><div class="line-number">문장 ${String(i+1).padStart(2,'0')}</div><div class="line-en">${safe(sentence)}</div><div class="line-ko">${safe(x.translation||'해석 준비 중')}</div>${x.grammar?.length?`<details class="grammar-drop"><summary>문법 · 주요 표현 <span>▾</span></summary><ul>${x.grammar.map(g=>`<li>${safe(g)}</li>`).join('')}</ul></details>`:''}</article>`;}).join('')}
    </div><button class="btn btn-primary full" data-action="navigate" data-target="passage">다른 유형 학습하기 →</button>`;
}

function vocabView(){const p=passage(),voc=p.vocabulary||[];if(!voc.length)return `${header('단어 학습',p.title)}<div class="intro" style="text-align:center;padding:32px 22px"><div style="font-size:34px;margin-bottom:10px">Aa</div><h2 class="intro-title">단어장을 기다리고 있어요</h2><p>단어 목록을 나중에 보내주기로 했으므로 현재는 비워 두었습니다.<br>ChatGPT에서 단어 데이터를 완성하면 지문 JSON을 다시 불러올 수 있습니다.</p><button class="btn btn-primary" style="margin-top:18px" data-action="navigate" data-target="passage">다른 문제 풀기</button></div>`;
return `${header('단어 학습',p.title)}<div class="intro"><p>영어 단어를 확인한 뒤 뜻을 펼쳐 보세요.</p></div>${voc.map((v,i)=>`<div class="passage-card" style="margin-top:10px"><div class="eyebrow">WORD ${i+1}</div><h3>${safe(v.word||v.english||'')}</h3><details><summary style="cursor:pointer;color:#31704e;font-weight:800">뜻 확인하기</summary><p style="margin:10px 0">${safe(v.meaning||v.korean||'')}</p>${v.synonyms?`<div class="word-hint"><span>유의어</span>${safe(v.synonyms)}</div>`:''}${v.antonyms?`<div class="word-hint"><span>반의어</span>${safe(v.antonyms)}</div>`:''}</details></div>`).join('')}`;}
function recordsView(){const ps=db.passages,summary=ps.reduce((a,p)=>{for(const v of Object.values(stats(p))){a.sessions+=v.sessions||0;a.correct+=v.correct||0;a.total+=v.total||0;}return a;},{sessions:0,correct:0,total:0});let html=`<div class="section-head" style="margin-top:0"><h2>나의 학습 기록</h2><span class="section-note">이 브라우저 기준</span></div><div class="stat-grid"><div class="stat"><strong>${ps.length}</strong><span>등록 지문</span></div><div class="stat"><strong>${summary.sessions}</strong><span>완료한 학습</span></div><div class="stat"><strong>${summary.total?Math.round(summary.correct/summary.total*100):0}%</strong><span>평균 정답률</span></div></div><div class="section-head"><h2>지문별 기록</h2></div>`;
html+=ps.map(p=>{const st=stats(p);return `<div class="passage-card"><h3 style="margin-top:0">${safe(p.title)}</h3><p>${safe(p.unit||'직접 등록')}</p>${['arrange','blanks','connectors'].map(t=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f1;font-size:12px"><span>${{arrange:'문장 배열',blanks:'빈칸',connectors:'연결어'}[t]}</span><strong>${st[t]?`${st[t].sessions}회 · 최고 ${st[t].best}%`:'학습 전'}</strong></div>`).join('')}<button class="btn btn-soft full" style="margin-top:15px" data-action="open-passage" data-id="${safe(p.id)}">이 지문 학습</button></div>`}).join('');return html;}
function importView(){return `${header('지문 추가','ChatGPT를 이용해 지문 데이터 등록','home')}<div class="intro"><h2 class="intro-title">새로운 지문을 추가하는 방법</h2><p>ChatGPT에 영어 지문을 보내고 <b>“English Loop 웹용 지문 JSON으로 만들어 줘”</b>라고 요청하세요. 받은 JSON을 아래에 붙여넣거나 파일로 불러오면 됩니다.</p></div><div class="import-form"><label class="formlabel" for="jsontext">지문 JSON 데이터</label><textarea id="jsontext" class="text-input textarea" placeholder='{"id":"my_passage_01","title":"새 지문","unit":"학교 영어 · 1과","sentences":["First sentence.","Second sentence."],"blanks":[],"connectors":[],"vocabulary":[]}'></textarea><p class="help">기본 지문 구조: id, title, unit, sentences(문장 목록), blanks, connectors, vocabulary. 추가한 지문은 현재 브라우저에 보관됩니다.</p><label class="filelabel">↑ JSON 파일 선택해서 불러오기<input id="jsonfile" type="file" accept=".json,application/json,text/plain" /></label><div class="divider"></div><button class="btn btn-primary full" data-action="save-passage">지문 저장하기 →</button><div id="import-error" role="alert"></div></div><div class="notice" style="margin-top:13px">📌 등록한 지문과 학습 기록은 이 기기의 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않으며, 브라우저 데이터를 삭제하면 사라질 수 있습니다. 저작권이 있는 해설 자료는 공개 배포하지 마세요.</div>`;}
function navView(){const active=state.page==='records'?'records':state.page==='import'?'import':'home';return [{id:'home',icon:'⌂',label:'지문 목록'},{id:'records',icon:'▥',label:'학습 기록'},{id:'import',icon:'＋',label:'지문 추가'}].map(x=>`<button class="navbtn" data-action="navigate" data-target="${x.id}" ${active===x.id?'aria-current="page"':''}><span class="navicon">${x.icon}</span><span>${x.label}</span></button>`).join('');}
function render(){const el=document.querySelector('#screen');el.innerHTML=({home:homeView,passage:passageView,arrange:orderView,quiz:quizView,read:readView,study:studyView,vocab:vocabView,records:recordsView,import:importView}[state.page]||homeView)();document.querySelector('#bottomnav').innerHTML=navView();}
function verifyPassage(x){if(!x||typeof x!=='object'||Array.isArray(x))throw Error('지문 데이터는 JSON 객체 형태여야 합니다.');if(!Array.isArray(x.sentences)||x.sentences.length<2||x.sentences.some(s=>typeof s!=='string'||!s.trim()))throw Error('sentences에 영어 문장 2개 이상을 입력해 주세요.');if(x.sentences.length>100)throw Error('한 지문은 최대 100문장까지 등록할 수 있습니다.');if(typeof x.title!=='string'||!x.title.trim())throw Error('title(지문 제목)이 필요합니다.');if(x.blanks&&!Array.isArray(x.blanks))throw Error('blanks는 배열이어야 합니다.');if(x.connectors&&!Array.isArray(x.connectors))throw Error('connectors는 배열이어야 합니다.');for(const type of ['blanks','connectors'])for(const q of x[type]||[]){if(!Number.isInteger(q.sentence_index)||q.sentence_index<0||q.sentence_index>=x.sentences.length)throw Error(type+'의 sentence_index가 올바르지 않습니다.');if(typeof q.target!=='string'||!x.sentences[q.sentence_index].includes(q.target))throw Error(type+'의 target이 원문에 없습니다.');if(!Array.isArray(q.choices)||q.choices.length<2||!q.choices.includes(q.target))throw Error(type+'의 선택지에 정답이 없습니다.');}
return {id:String(x.id||('user_'+Date.now())),title:x.title.trim().slice(0,140),unit:String(x.unit||'직접 추가한 지문'),source:String(x.source||'직접 추가'),sentences:x.sentences,blanks:x.blanks||[],connectors:x.connectors||[],vocabulary:Array.isArray(x.vocabulary)?x.vocabulary:[],study:(x.study&&typeof x.study==='object'&&!Array.isArray(x.study))?x.study:null};}
function saveImport(){const input=document.querySelector('#jsontext');try{let raw=input.value.trim();if(!raw)throw Error('JSON 데이터를 먼저 붙여넣어 주세요.');const parsed=JSON.parse(raw);const items=Array.isArray(parsed)?parsed:[parsed];if(items.length>50)throw Error('한 번에 최대 50개의 지문을 추가할 수 있습니다.');const imported=items.map(verifyPassage);for(const p of imported){const idx=db.passages.findIndex(q=>q.id===p.id);if(idx>=0)db.passages[idx]=p;else db.passages.push(p);}persist();state.search='';toast(`${imported.length}개 지문을 저장했습니다.`);state.passageId=imported[0].id;show('passage');}catch(e){document.querySelector('#import-error').innerHTML=`<p class="error-text">${safe(e.message||'JSON 형식을 확인해 주세요.')}</p>`;}}
function clickAction(action,btn){if(action==='navigate'){show(btn.dataset.target);return;}if(action==='open-passage'){openPassage(btn.dataset.id);return;}if(action==='start-type'){const t=btn.dataset.type;if(t==='arrange')startArrange();else if(t==='vocab')show('vocab');else startQuiz(t);return;}if(action==='start-arrange'){startArrange();return;}if(action==='select-sentence'){if(state.orderSubmitted)return;const idx=Number(btn.dataset.idx);if(!state.orderSelected.includes(idx)){state.orderSelected.push(idx);render();}return;}if(action==='undo-order'){state.orderSelected.pop();render();return;}if(action==='clear-order'){state.orderSelected=[];render();return;}if(action==='check-order'){const expected=state.orderItems.map(x=>x.idx).sort((a,b)=>a-b);if(state.orderSelected.length!==expected.length)return;const right=state.orderSelected.every((x,i)=>x===expected[i]);state.orderSubmitted=true;record('arrange',right?1:0,1);render();return;}if(action==='choose-option'){if(state.quizSelected!==null)return;const q=getQuestions()[state.quizIndex];state.quizSelected=q.choices[Number(btn.dataset.index)];const correct=state.quizSelected===q.target;if(correct)state.quizCorrect++;state.quizResults.push({answer:q.target,selected:state.quizSelected,correct});render();return;}if(action==='next-quiz'){if(state.quizSelected===null)return;if(state.quizIndex===getQuestions().length-1){state.quizComplete=true;record(state.quizType,state.quizCorrect,getQuestions().length);}else{state.quizIndex++;state.quizSelected=null;}render();window.scrollTo({top:0,behavior:'instant'});return;}if(action==='save-passage'){saveImport();return;}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){clickAction(btn.dataset.action,btn);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;document.querySelector('#passage-list').innerHTML=passageCards(db.passages.filter(p=>(p.title+' '+p.unit+' '+(p.source||'')).toLowerCase().includes(state.search.toLowerCase().trim())));}});
document.addEventListener('change',async e=>{if(e.target.id==='jsonfile'&&e.target.files?.[0]){try{const text=await e.target.files[0].text();document.querySelector('#jsontext').value=text;toast('JSON 파일을 불러왔습니다. 저장하기를 눌러주세요.');}catch(err){toast('파일을 읽지 못했습니다.');}}});
render();
</script>
</body></html>
